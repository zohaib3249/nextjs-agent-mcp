name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build bridge
        run: npm run build

      - name: Verify bridge build output
        run: |
          test -f bridge/index.js
          head -1 bridge/index.js | grep -q "use client"
          echo "bridge built and 'use client' preserved ✓"

      - name: Run tests (WS round-trip, no browser)
        run: npm test
