name: Publish to npm

# Publishes the package to npm when you create a GitHub Release (or push a v* tag).
# Setup: add an npm automation token as the repo secret NPM_TOKEN
#   (npmjs.com → Access Tokens → Generate → "Automation"), then:
#   Repo → Settings → Secrets and variables → Actions → New repository secret → NPM_TOKEN.

# Fires on a published GitHub Release only. (Creating a release also creates the tag, so we don't
# also listen on tag pushes — that would start two concurrent publishes of the same version, one
# of which fails as a duplicate.)
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # enables npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build bridge
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
